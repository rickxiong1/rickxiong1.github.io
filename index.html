    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rick Xiong — Visual Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #000000;
            --text: #ffffff;
            --accent: #3b82f6;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Framer-style soft background gradients */
        body::before {
            content: "";
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.03) 0%, transparent 50%);
            z-index: -1;
            pointer-events: none;
        }

        /* Framer-style Glass Panel */
        .framer-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .framer-panel:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
            box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
        }

        /* Shimmering Gradient Text */
        .gradient-text {
            background: linear-gradient(to right, #ffffff 20%, #a78bfa 40%, #81D8D0 60%, #ffffff 80%);
            background-size: 200% auto;
            color: #000;
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 6s linear infinite;
        }

        @keyframes shine {
            to { background-position: 200% center; }
        }

        /* Aurora Background Glows */
        .aurora-glow {
            position: absolute;
            filter: blur(100px);
            opacity: 0.5;
            z-index: 0;
            border-radius: 50%;
            mix-blend-mode: screen;
            animation: aurora-move 15s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes aurora-move {
            0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
            100% { transform: translate(5%, -5%) scale(1.1); opacity: 0.6; }
        }

        /* Infinite Marquee Animation */
        @keyframes scroll {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        
        .animate-scroll {
            animation: scroll 30s linear infinite;
        }

        /* Enhanced Floating Animation */
        @keyframes float-y {
            0% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0); }
        }
        .animate-float {
            animation: float-y 6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            will-change: transform;
        }

        /* Custom Cursor Styling */
        * { cursor: none !important; }

        .cursor-dot {
            width: 8px;
            height: 8px;
            background: #fff;
            mix-blend-mode: difference;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
            transition: width 0.2s ease, height 0.2s ease, opacity 0.2s ease;
        }

        .cursor-ring {
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            mix-blend-mode: difference;
            border-radius: 50%;
            position: fixed;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 
                width 0.3s cubic-bezier(0.16, 1, 0.3, 1), 
                height 0.3s cubic-bezier(0.16, 1, 0.3, 1),
                background-color 0.3s ease,
                border-color 0.3s ease;
        }

        .cursor-text {
            color: white;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        body.is-hovering .cursor-dot { opacity: 0; }
        body.is-hovering .cursor-ring {
            width: 80px;
            height: 80px;
            background-color: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
        }
        body.is-hovering .cursor-text { opacity: 1; }
        body.is-clicking .cursor-ring { transform: translate(-50%, -50%) scale(0.9); }

        html { scroll-behavior: smooth; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        ::-webkit-scrollbar-track { background: transparent; }
    </style>
